# Temporary verification workflow (test branch only, not part of the PR).
# Runs the same checks as checks.yml: typecheck + unit tests.
name: Phase1 checks (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm run test:unit
